<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GDO Transmitter</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root{--fg:#d9faff;--panel:#0f1b23;--line:#12313a;--accent:#00e6e6}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#000;color:var(--fg);font-family:Orbitron,system-ui,Segoe UI,Roboto,Arial,sans-serif}
  main{min-height:100dvh;display:grid;place-items:center;position:relative;overflow:hidden}
  main:before{content:"";position:absolute;inset:0;background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),
    radial-gradient(1200px 800px at 20% 10%, #08131a 0%, #000 55%)}
  .card{z-index:1;width:min(680px,92vw);background:var(--panel);border:1px solid var(--line);
    border-radius:18px;padding:22px;box-shadow:0 0 44px #00e6e625}
  h1{margin:0 0 12px;color:var(--accent);letter-spacing:2px;text-shadow:0 0 14px #00e6e63d}
  label{display:block;margin:12px 0 6px}
  input,select,button{width:100%;background:#0b141a;color:var(--fg);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;font-family:inherit}
  button{cursor:pointer}
  .row{display:grid;grid-template-columns:1fr 160px;gap:10px}
  .out{margin-top:10px;font-size:12px;word-break:break-all}
  .ok{color:#2ee66b}.warn{color:#ffb02e}

  /* Overlays */
  #overlayRoot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#000000ea;z-index:9999}
  #overlayRoot.show{display:flex}

  /* BASE/ALERT (Codes 1–9 only) */
  .baTitle{color:#ff2a2a;font-weight:900;text-transform:uppercase;text-align:center;line-height:.92;text-shadow:0 0 22px #900;position:relative;height:min(14vw,120px)}
  .baWord{letter-spacing:4px;font-size:min(14vw,120px);position:absolute;left:50%;top:0;transform:translateX(-50%);animation-duration:2s;animation-iteration-count:infinite;animation-timing-function:linear}
  @keyframes baseFade{0%{opacity:1}49%{opacity:1}50%{opacity:0}99%{opacity:0}}
  @keyframes alertFade{0%{opacity:0}49%{opacity:0}50%{opacity:1}99%{opacity:1}}
  .baWord.base{animation-name:baseFade}
  .baWord.alert{animation-name:alertFade}
  .codeBox{margin-top:24px;border:12px solid #ff2a2a;color:#ff2a2a;padding:10px 28px;font-weight:900;
    font-size:min(12vw,100px);letter-spacing:6px;box-shadow:0 0 28px #900 inset,0 0 20px #900}
  .desc{margin-top:12px;max-width:min(900px,92vw);text-align:center;font-size:min(4vw,22px);opacity:.95}

  /* BIOHAZARD: neon green symbol + haze */
  #bioWrap{display:none;align-items:center;gap:18px;text-align:center}
  #bioTitle{font-size:min(9vw,72px);color:#31ff6b;font-weight:900;text-shadow:0 0 18px #12ff57}
  .bioSymbol{position:relative;width:min(42vw,340px);height:min(42vw,340px);border-radius:50%;
    box-shadow:0 0 25px #12ff57 inset, 0 0 30px #12ff57;}
  .bioSymbol::before,.bioSymbol::after{content:"";position:absolute;inset:14%;border:8px solid #31ff6b;border-radius:50%}
  .bioSymbol::after{inset:34%}
  .bioArm{position:absolute;width:55%;height:55%;border:14px solid #31ff6b;border-top-color:transparent;border-left-color:transparent;border-radius:50%;top:22%;left:22%;transform-origin:50% 50%;animation:bioSpin 8s linear infinite}
  .bioArm.a{transform:rotate(0)} .bioArm.b{transform:rotate(120deg)} .bioArm.c{transform:rotate(240deg)}
  @keyframes bioSpin{to{transform:rotate(360deg)}}
  .bioHaze{position:absolute;inset:-10%;filter:blur(26px);background:radial-gradient(closest-side,#1aff4b33,#00ff6222,#0000)}

  /* POWER FAILURE: dim + red emergency flicker */
  #powerWrap{display:none;text-align:center}
  .powerDim{position:absolute;inset:0;background:#000;opacity:.75;animation:flick 3.6s infinite}
  .powerLabel{position:relative;margin-top:20px;font-size:min(8vw,64px);color:#ff4d4d;letter-spacing:3px;font-weight:900;text-shadow:0 0 24px #a00}
  @keyframes flick{0%,92%,100%{opacity:.75}93%{opacity:.3}96%{opacity:.9}}

  /* COMMS FAILURE: scanlines + noise + failing bars */
  #commsWrap{display:none;text-align:center;position:relative;overflow:hidden}
  .scanlines{position:absolute;inset:0;background:
    repeating-linear-gradient(180deg,rgba(255,255,255,.08) 0 2px,transparent 2px 4px);
    mix-blend-mode:overlay;animation:sl 2.2s linear infinite}
  @keyframes sl{to{transform:translateY(4px)}}
  .noise{position:absolute;inset:0;background:
    radial-gradient(transparent 0 50%,#000 70%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.2'/></svg>") repeat;
    opacity:.35;animation:noise 1.2s steps(4) infinite}
  @keyframes noise{to{transform:translate(-10px,8px)}}
  .commsTitle{position:relative;font-size:min(8vw,64px);color:#ffef5a;font-weight:900;text-shadow:0 0 14px #ffef5a88}
  .bars{position:relative;display:flex;gap:6px;justify-content:center;margin-top:10px}
  .bar{width:10px;height:50px;background:#1fe3ff;animation:bars 1.2s infinite ease-in-out}
  .bar:nth-child(2){animation-delay:.1s}.bar:nth-child(3){animation-delay:.2s}.bar:nth-child(4){animation-delay:.3s}.bar:nth-child(5){animation-delay:.4s}
  @keyframes bars{0%,100%{height:12px;opacity:.3}50%{height:60px;opacity:1}}

  /* EVAC overlay */
  #evacWrap{display:none;text-align:center}
  .evacText{font-size:min(20vw,180px);color:#ff2a2a;font-weight:900;letter-spacing:10px;animation:evacPulse 1.4s infinite}
  @keyframes evacPulse {0%{opacity:1}50%{opacity:0.2}100%{opacity:1}}
  .evacDesc{margin-top:8px;opacity:.95}

  /* SELF-DESTRUCT: ring + chevrons + countdown */
  #sdWrap{display:none;text-align:center;position:relative}
  .ring{width:min(70vw,520px);height:min(70vw,520px);border:10px dashed #ff4d4d;border-radius:50%;margin:auto;animation:ringspin 10s linear infinite;box-shadow:0 0 30px #a00}
  @keyframes ringspin{to{transform:rotate(360deg)}}
  .chevrons{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:8px}
  .chev{width:32px;height:12px;background:#ff6d6d;box-shadow:0 0 12px #a00}
  .sdTimer{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:min(18vw,160px);font-weight:900;color:#ff3b3b;letter-spacing:4px;text-shadow:0 0 30px #a00}
  .sdLabel{margin-top:12px;color:#ff6868;font-weight:800;letter-spacing:2px}

  /* Click-to-enable banner */
  #soundBanner{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#0f1b23;border:1px solid #12313a;
    padding:10px 14px;border-radius:12px;font-size:14px;z-index:10000;display:none;cursor:pointer}
  #soundBanner.show{display:block}
</style>
</head>
<body>
<main>
  <div class="card">
    <div style="display:flex;align-items:center;gap:10px;justify-content:space-between">
      <h1>GDO Transmitter</h1>
      <a href="../index.html" style="text-decoration:none"><button>← Back</button></a>
    </div>

    <label for="code">Access Code</label>
    <input id="code" autocomplete="off" placeholder="Enter code…"/>

    <div class="row">
      <div>
        <label for="freq">Frequency</label>
        <select id="freq">
          <option value="alpha-1">alpha-1</option>
          <option value="bravo-2">bravo-2</option>
          <option value="charlie-3">charlie-3</option>
        </select>
      </div>
      <div>
        <label>&nbsp;</label>
        <button id="send">Transmit</button>
      </div>
    </div>

    <div class="out"><b>Status:</b> <span id="status">Idle</span></div>
    <div class="out"><b>Encrypted:</b> <span id="enc">—</span></div>
    <div class="out"><b>Decrypted:</b> <span id="dec">—</span></div>
  </div>
</main>

<!-- Overlays root -->
<div id="overlayRoot" aria-hidden="true">
  <!-- BASE/ALERT -->
  <div id="baWrap" style="display:none;text-align:center">
    <div class="baTitle">
      <div class="baWord base">BASE</div>
      <div class="baWord alert">ALERT</div>
    </div>
    <div id="baCode" class="codeBox">CODE 9</div>
    <div id="baDesc" class="desc">—</div>
  </div>

  <!-- BIOHAZARD -->
  <div id="bioWrap">
    <div class="bioSymbol">
      <div class="bioHaze"></div>
      <div class="bioArm a"></div><div class="bioArm b"></div><div class="bioArm c"></div>
    </div>
    <div id="bioTitle">BIOHAZARD</div>
    <div id="bioDesc" class="desc">—</div>
  </div>

  <!-- POWER FAILURE -->
  <div id="powerWrap">
    <div class="powerDim"></div>
    <div class="powerLabel">EMERGENCY POWER</div>
    <div id="powerDesc" class="desc">—</div>
  </div>

  <!-- COMMS FAILURE -->
  <div id="commsWrap">
    <div class="scanlines"></div><div class="noise"></div>
    <div class="commsTitle">COMMUNICATIONS FAILURE</div>
    <div class="bars">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
    <div id="commsDesc" class="desc">—</div>
  </div>

  <!-- EVAC -->
  <div id="evacWrap">
    <div class="evacText">EVAC</div>
    <div id="evacDesc" class="evacDesc">—</div>
  </div>

  <!-- SELF-DESTRUCT -->
  <div id="sdWrap">
    <div class="ring"></div>
    <div class="chevrons">
      <div class="chev"></div><div class="chev"></div><div class="chev"></div>
      <div class="chev"></div><div class="chev"></div><div class="chev"></div>
    </div>
    <div id="sdTimer" class="sdTimer">05:00</div>
    <div class="sdLabel">AUTODESTRUCT IN PROGRESS</div>
    <div id="sdDesc" class="desc">—</div>
  </div>
</div>

<div id="soundBanner" title="Enable audio">🔊 This page plays alarm sounds. Due to browser policy, click here once to enable audio.</div>

<!-- loop alarm + one-shot announcement -->
<audio id="sndLoop" preload="auto" loop></audio>
<audio id="sndAnn"  preload="auto"></audio>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
  import { getDatabase, ref, push, set, serverTimestamp, onValue, get } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";

  const ALARM_KEYS = [
    "CODE 1","CODE 2","CODE 3","CODE 4","CODE 5","CODE 6","CODE 7","CODE 8","CODE 9",
    "BIOHAZARD","POWER FAILURE","COMMUNICATIONS FAILURE","EVAC","SELF-DESTRUCT"
  ];

  /* =======================
     🔊 EASY SOUND SWAPS
     Omit key or set "" to silence. ANN plays once on activation.
     ======================= */
  const SOUNDS = {
    LOOP: {
      "CODE 1": "https://file.garden/aACuwggY3QmuIi9B/code_alarms/panicalarm_realistic.mp3",
      "CODE 2": "https://file.garden/aACuwggY3QmuIi9B/code_alarms/security-alarm_realistic.mp3",
      "CODE 3": "https://file.garden/aACuwggY3QmuIi9B/code_alarms/code3_realistic.mp3",
      "CODE 4": "https://file.garden/aACuwggY3QmuIi9B/code_alarms/incomingalarm_realistic.mp3",
      "CODE 5": "https://file.garden/aACuwggY3QmuIi9B/code_alarms/Security%20Alarm%20(1%20Hour%20of%20Ambience)%20%5B8r4cNMKf4Hw%5D.mp3",
      "CODE 6": "https://file.garden/aACuwggY3QmuIi9B/code_alarms/1%20HOUR%20-%20Emergency%20Base%20ALARM%20%5BrlxFz29bcyg%5D.mp3",
      "CODE 7": "https://file.garden/aACuwggY3QmuIi9B/code_alarms/Emergency%20Lockdown%20Alarm%20%5B1ua4r3mhW3U%5D.mp3",
      "CODE 8": "https://file.garden/aACuwggY3QmuIi9B/code_alarms/doorsalarm_realistic.mp3",
      "CODE 9": "https://file.garden/aACuwggY3QmuIi9B/code_alarms/evac_realistic.mp3",
      "BIOHAZARD": "",
      "POWER FAILURE": "",
      "COMMUNICATIONS FAILURE": "",
      "EVAC": "https://file.garden/aACuwggY3QmuIi9B/code_alarms/evac_realistic.mp3",
      "SELF-DESTRUCT": ""
    },
    ANN: {
      "CODE 2": "https://file.garden/aACuwggY3QmuIi9B/code_announcments/Code%202%20Stargate%20Horizons%20%5BMcCRu_SawAc%5D.mp3",
      "CODE 4": "https://file.garden/aACuwggY3QmuIi9B/code_announcments/Code%204%20Stargate%20Horizons%20%5BnptsmOeQ0u4%5D.mp3",
      "CODE 5": "https://file.garden/aACuwggY3QmuIi9B/code_announcments/Code%205%20Stargate%20Horizons%20%5BJIuYroVSrr0%5D.mp3",
      "CODE 6": "https://file.garden/aACuwggY3QmuIi9B/code_announcments/Code%206%20Stargate%20Horizons%20%5B3t7YH6A0cxc%5D.mp3",
      "CODE 7": "https://file.garden/aACuwggY3QmuIi9B/code_announcments/Code%207%20Stargate%20Horizons%20%5B0l5vnUf6ypg%5D.mp3",
      "CODE 9": "https://file.garden/aACuwggY3QmuIi9B/code_announcments/Code%209%20Stargate%20Horizons%20%5B-0tvyBMhnNA%5D.mp3",
      "BIOHAZARD": "",
      "POWER FAILURE": "",
      "COMMUNICATIONS FAILURE": "",
      "EVAC": "https://file.garden/aACuwggY3QmuIi9B/code_announcments/evac_a.mp3",
      "SELF-DESTRUCT": ""
    }
  };

  const DEFAULT_DESC = {
    "CODE 1":"Personnel Panic Alert — Panic button pressed; unknown immediate danger nearby.",
    "CODE 2":"Medical Emergency — Serious medical incident or injury within the facility.",
    "CODE 3":"Unidentified Anomaly Detected — Unknown phenomenon or entity inside the base; not yet confirmed hostile.",
    "CODE 4":"Strategic Muster / Gate Room Conflict — Combat or confrontation occurring in or near the Gate Room.",
    "CODE 5":"Active Combat in Facility — Confirmed armed engagement within base sectors.",
    "CODE 6":"Hostile Force Mobilization — External enemy force preparing to attack or raid the base.",
    "CODE 7":"Lockdown Directive — Full internal lockdown active; no entry or exit permitted.",
    "CODE 8":"Unauthorized Breach / Forced Entry — Confirmed external or off-world hostile entry into the facility.",
    "CODE 9":"Rogue or Compromised Personnel — One or more base members confirmed rogue or under external control.",
    "BIOHAZARD":"Biohazard Containment Alert — Pathogen, chemical, or alien contaminant detected; lab quarantine.",
    "POWER FAILURE":"Power / Reactor Failure — Naquadah generator or reactor instability; switch to emergency power.",
    "COMMUNICATIONS FAILURE":"Communications Failure — EMP, jamming, or network outage; revert to manual comms.",
    "EVAC":"Evacuation Order (EVAC) — Imminent base loss or self-destruct; full personnel evacuation.",
    "SELF-DESTRUCT":"Self-Destruct Sequence — Dual-key authorization; 30–60 s countdown."
  };

  const firebaseConfig = {
    apiKey: "AIzaSyAn5rsOUfkKBYhpQb3qwdUTElJP8Kg0dW0",
    authDomain: "project-gdo.firebaseapp.com",
    databaseURL: "https://project-gdo-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "project-gdo",
    storageBucket: "project-gdo.appspot.com",
    messagingSenderId: "758705115255",
    appId: "1:758705115255:web:878f5e64c164b75c507672"
  };
  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  // UI refs
  const codeEl=document.getElementById('code'), freqEl=document.getElementById('freq'), sendBtn=document.getElementById('send');
  const stEl=document.getElementById('status'), encEl=document.getElementById('enc'), decEl=document.getElementById('dec');

  const overlayRoot=document.getElementById('overlayRoot');
  const baWrap=document.getElementById('baWrap'), baCode=document.getElementById('baCode'), baDesc=document.getElementById('baDesc');

  const bioWrap=document.getElementById('bioWrap'), bioTitle=document.getElementById('bioTitle'), bioDesc=document.getElementById('bioDesc');
  const powerWrap=document.getElementById('powerWrap'), powerDesc=document.getElementById('powerDesc');
  const commsWrap=document.getElementById('commsWrap'), commsDesc=document.getElementById('commsDesc');

  const evacWrap=document.getElementById('evacWrap'), evacDesc=document.getElementById('evacDesc');
  const sdWrap=document.getElementById('sdWrap'), sdTimer=document.getElementById('sdTimer'), sdDesc=document.getElementById('sdDesc');

  const sndLoop=document.getElementById('sndLoop'), sndAnn=document.getElementById('sndAnn'), soundBanner=document.getElementById('soundBanner');

  let soundsEnabled=false, currentActive=null, announcedFor=null, sdInterval=null, sdEndsAt=0;

  soundBanner.classList.add('show');
  function enableAudio(){
    if (soundsEnabled) return;
    soundsEnabled=true;
    soundBanner.classList.remove('show');
    if (currentActive){ startLoop(currentActive); playAnnouncement(currentActive); }
  }
  soundBanner.addEventListener('click', enableAudio);
  window.addEventListener('pointerdown', enableAudio, { once:true });

  function stopAllAudio(){ try{sndLoop.pause();sndAnn.pause();sndLoop.currentTime=0;sndAnn.currentTime=0;}catch{} }
  async function playWithRetry(el){ for(let i=0;i<3;i++){ try{await el.play();return;}catch{await new Promise(r=>setTimeout(r,150));} } }
  function startLoop(key){
    if(!soundsEnabled){soundBanner.classList.add('show');return;}
    const url=SOUNDS.LOOP[key];
    if(!url){stopAllAudio();return;}
    if(sndLoop.src!==url){sndLoop.src=url;sndLoop.load();}
    sndLoop.loop=true;sndLoop.volume=1.0;sndLoop.currentTime=0;playWithRetry(sndLoop);
  }
  function playAnnouncement(key){
    const url=SOUNDS.ANN[key];
    if(!url||!soundsEnabled) return;
    if(announcedFor===key) return;
    announcedFor=key; sndAnn.src=url; sndAnn.load(); sndAnn.currentTime=0; playWithRetry(sndAnn);
  }
  sndLoop.addEventListener('ended',()=>{try{sndLoop.currentTime=0;sndLoop.play();}catch{}});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&currentActive&&soundsEnabled){startLoop(currentActive);}});

  function hideAll(){
    baWrap.style.display='none';
    bioWrap.style.display='none';
    powerWrap.style.display='none';
    commsWrap.style.display='none';
    evacWrap.style.display='none';
    sdWrap.style.display='none';
    overlayRoot.classList.remove('show');
    if(sdInterval){ clearInterval(sdInterval); sdInterval=null; }
  }

  function renderOverlay(key, desc){
    hideAll();
    if(!key){ stopAllAudio(); return; }
    overlayRoot.classList.add('show');

    if(/^CODE [1-9]$/.test(key)){
      baWrap.style.display='block';
      baCode.textContent=key;
      baDesc.textContent=(desc||DEFAULT_DESC[key]||'—');
      return;
    }

    if(key==="BIOHAZARD"){
      bioWrap.style.display='flex';
      bioTitle.textContent="BIOHAZARD";
      bioDesc.textContent=(desc||DEFAULT_DESC[key]||'—');
      return;
    }

    if(key==="POWER FAILURE"){
      powerWrap.style.display='block';
      powerDesc.textContent=(desc||DEFAULT_DESC[key]||'—');
      return;
    }

    if(key==="COMMUNICATIONS FAILURE"){
      commsWrap.style.display='block';
      commsDesc.textContent=(desc||DEFAULT_DESC[key]||'—');
      return;
    }

    if(key==="EVAC"){
      evacWrap.style.display='block';
      evacDesc.textContent=(desc||DEFAULT_DESC[key]||'—');
      return;
    }

    if(key==="SELF-DESTRUCT"){
      sdWrap.style.display='block';
      sdDesc.textContent=(desc||DEFAULT_DESC[key]||'—');
      sdEndsAt = Date.now() + 5*60*1000;
      const tick=()=>{
        const remain = Math.max(0, sdEndsAt - Date.now());
        const m = Math.floor(remain/60000);
        const s = Math.floor((remain%60000)/1000);
        sdTimer.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        if(remain<=0 && sdInterval){ clearInterval(sdInterval); sdInterval=null; }
      };
      tick();
      sdInterval=setInterval(tick, 250);
      return;
    }
  }

  function activeFrom(alerts){
    for (const key of ALARM_KEYS){
      const node = alerts?.[key];
      if (node && node.active) return { key, desc: node.desc || '' };
    }
    return null;
  }

  (async ()=>{
    try{
      const first = await get(ref(db,'alerts'));
      const a = first.exists()? first.val() : {};
      const act = activeFrom(a);
      currentActive = act ? act.key : null;
      announcedFor = null;
      renderOverlay(act?.key||null, act?.desc||'');
      if(currentActive && soundsEnabled){ startLoop(currentActive); playAnnouncement(currentActive); }
      else if(!currentActive){ stopAllAudio(); }
    }catch{}
    onValue(ref(db,'alerts'), snap=>{
      const a = snap.exists()? snap.val() : {};
      const act = activeFrom(a);
      const next = act ? act.key : null;

      renderOverlay(act?.key||null, act?.desc||'');

      if(next !== currentActive){
        currentActive = next; announcedFor = null;
        if(currentActive && soundsEnabled){ startLoop(currentActive); playAnnouncement(currentActive); }
        else if(!currentActive){ stopAllAudio(); }
      } else if(currentActive && soundsEnabled){
        startLoop(currentActive);
      }
    });
  })();

  // --- Transmit with fake encrypt + 15s cooldown ---
  const sleep = ms => new Promise(r=>setTimeout(r,ms));
  let cooldown=false;
  document.getElementById('send').onclick = async ()=>{
    if (cooldown) return;
    const code=(codeEl.value||"").trim(), ch=freqEl.value;
    if (!code){ stEl.textContent="Enter code"; stEl.className='warn'; return; }

    cooldown=true; sendBtn.disabled=true;
    stEl.textContent="ENCRYPTING…"; stEl.className=''; decEl.textContent=code;

    const encrypted=btoa(unescape(encodeURIComponent(code)));
    await sleep(400); encEl.textContent=encrypted;

    const newRef = push(ref(db, `frequencies/${ch}/signals`));
    await set(newRef, { code, decrypted: code, encrypted, timestamp: serverTimestamp() });

    stEl.textContent="Transmitted"; stEl.className='ok';
    await sleep(900);
    for (let i=15;i>0;i--){ stEl.textContent=`Cooldown ${i}s…`; await sleep(1000); }
    stEl.textContent="Idle"; cooldown=false; sendBtn.disabled=false;
  };
</script>
</body>
</html>
