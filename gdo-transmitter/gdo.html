<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GDO Transmitter</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0f14;--fg:#d9faff;--accent:#00e6e6}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0f14;color:var(--fg);font-family:Orbitron,system-ui,Segoe UI,Roboto,Arial,sans-serif}
  .card{width:min(560px,92vw);background:#0f1b23;border:1px solid #12313a;border-radius:16px;padding:18px 18px 22px;box-shadow:0 0 40px #00e6e61f}
  h1{margin:0 0 8px;color:var(--accent)}
  label{display:block;margin:12px 0 6px}
  input,select,button{width:100%;background:#0b141a;color:#d9faff;border:1px solid #12313a;border-radius:10px;padding:10px 12px;font-family:inherit}
  button{cursor:pointer}
  .row{display:grid;grid-template-columns:1fr 160px;gap:10px}
  .hint{opacity:.8;font-size:12px;margin-top:4px}
  .out{margin-top:12px;font-size:12px;word-break:break-all}
  .ok{color:#2ee66b}.warn{color:#ffb02e}
</style>
</head>
<body>
  <div class="card">
    <div style="display:flex;align-items:center;gap:10px;justify-content:space-between">
      <h1>GDO Transmitter</h1>
      <a href="index.html" style="text-decoration:none"><button>← Back</button></a>
    </div>
    <label for="code">Access Code</label>
    <input id="code" autocomplete="off" placeholder="Enter code…"/>
    <div class="row">
      <div>
        <label for="freq">Frequency</label>
        <select id="freq">
          <option value="alpha-1">alpha-1</option>
          <option value="bravo-2">bravo-2</option>
          <option value="charlie-3">charlie-3</option>
        </select>
      </div>
      <div>
        <label>&nbsp;</label>
        <button id="send">Transmit</button>
      </div>
    </div>
    <div class="hint">This device is intentionally unauthenticated. Do not send real secrets.</div>
    <div class="out"><b>Status:</b> <span id="status">Idle</span></div>
    <div class="out"><b>Encrypted:</b> <span id="enc">—</span></div>
    <div class="out"><b>Decrypted:</b> <span id="dec">—</span></div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
  import { getDatabase, ref, push, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";

  // === CONFIG (STEJNÝ jako Listener) ===
  const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "YOUR_PROJECT",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const codeEl = document.getElementById('code');
  const freqEl = document.getElementById('freq');
  const sendBtn = document.getElementById('send');
  const stEl = document.getElementById('status');
  const encEl = document.getElementById('enc');
  const decEl = document.getElementById('dec');

  let cooldown = false;

  sendBtn.onclick = async () => {
    if (cooldown) return;
    const code = (codeEl.value||"").trim();
    const ch = freqEl.value;
    if (!code) { stEl.textContent = "Enter code"; stEl.className='warn'; return; }

    cooldown = true; sendBtn.disabled = true;
    stEl.textContent = "Encrypting…"; stEl.className='';
    decEl.textContent = code;

    // fake encryption: Base64 + malé zpoždění
    const encrypted = btoa(unescape(encodeURIComponent(code)));
    await new Promise(r => setTimeout(r, 400));
    encEl.textContent = encrypted;

    const path = `frequencies/${ch}/signals`;
    const newRef = push(ref(db, path));
    await set(newRef, { code, decrypted: code, encrypted, timestamp: serverTimestamp() });

    stEl.textContent = "Transmitted"; stEl.className='ok';
    await new Promise(r => setTimeout(r, 900));
    stEl.textContent = "Cooldown 10s…"; stEl.className='';

    for (let i=10;i>0;i--){ stEl.textContent = `Cooldown ${i}s…`; await new Promise(r=>setTimeout(r,1000)); }
    stEl.textContent = "Idle"; cooldown = false; sendBtn.disabled = false;
  };
</script>
</body>
</html>
