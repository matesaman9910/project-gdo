<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SGC Listener</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0f14;--fg:#d9faff;--accent:#00e6e6;--ok:#2ee66b;--warn:#ffb02e;--bad:#ff3b3b}
  html,body{height:100%;margin:0;background:radial-gradient(1200px 800px at 20% 10%, #092029 0%, #0a0f14 60%);color:var(--fg);font-family:Orbitron,system-ui,Segoe UI,Roboto,Arial,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:24px}
  h1{letter-spacing:2px;margin:0 0 16px;color:var(--accent);text-shadow:0 0 16px rgba(0,230,230,.35)}
  .bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}
  select,button,input{background:#0f1b23;color:var(--fg);border:1px solid #135760;border-radius:10px;padding:10px 14px;font-family:inherit;letter-spacing:1px}
  .status{padding:10px 14px;border-radius:10px;background:#0f1b23;border:1px solid #12313a}
  .status.blink{animation:blink 1s infinite} @keyframes blink{50%{opacity:.35}}
  .section{margin-top:18px;border:1px solid #12313a;border-radius:14px;padding:14px;background:#0b141a}
  .section h2{margin:0 0 10px;font-size:18px;color:#9fefff}
  .grid2{display:grid;grid-template-columns:1fr;gap:10px} @media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
  .log{margin-top:16px;border:1px solid #12313a;border-radius:14px;overflow:hidden;background:#0b141a}
  .log .row{display:grid;grid-template-columns:160px 1fr 140px 140px;gap:8px;padding:10px 14px;border-top:1px solid #102028}
  .log .row:first-child{border-top:none}
  .tag{border-radius:999px;padding:4px 10px;border:1px solid transparent;font-size:12px;justify-self:start}
  .ok{border-color:var(--ok);color:var(--ok)} .bad{border-color:var(--bad);color:var(--bad)} .warn{border-color:var(--warn);color:var(--warn)}
  #baseAlertOverlay{position:fixed;inset:0;background:#7a0000;display:none;z-index:9999;align-items:center;justify-content:center;flex-direction:column}
  #baseAlertOverlay.show{display:flex}
  .baseAlert{font-size:64px;font-weight:700;letter-spacing:6px;color:#fff;animation:blink 1s infinite}
  .codeBox{margin-top:18px;background:#000;border:6px solid #ff1a1a;color:#ff1a1a;padding:8px 20px;font-size:36px;font-weight:700;letter-spacing:4px}
  .soundBanner{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#0f1b23;border:1px solid #12313a;padding:8px 12px;border-radius:10px;font-size:14px;display:none}
  .soundBanner.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <h1>SGC Listener</h1>

  <div class="bar">
    <a href="index.html" style="text-decoration:none"><button>← Back</button></a>
    <button id="btnLogin">Sign in with Google</button>
    <button id="btnLogout" style="display:none">Sign out</button>
    <select id="selFreq" disabled>
      <option value="alpha-1">alpha-1</option>
      <option value="bravo-2">bravo-2</option>
      <option value="charlie-3">charlie-3</option>
    </select>
    <button id="btnMonitor" disabled>Monitor</button>
    <div id="state" class="status">Sign in required</div>
  </div>

  <!-- Alerts -->
  <div class="section" id="alertSection" style="display:none">
    <h2>Alerts</h2>
    <div class="grid2">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button id="btnCode9On">Activate CODE 9</button>
        <button id="btnCode9Off">Deactivate CODE 9</button>
        <span id="code9State" class="status" style="border-color:#12313a">Unknown</span>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button id="btnAllClear">All Clear</button>
      </div>
    </div>
  </div>

  <!-- Codes (CRUD pro všechny přihlášené) -->
  <div class="section" id="codesPanel" style="display:none">
    <h2>Codes</h2>
    <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
      <div style="flex:1;min-width:180px">
        <label style="display:block;margin-bottom:6px">Code</label>
        <input id="codeInput" placeholder="e.g. 256525457454">
      </div>
      <div style="flex:1;min-width:160px">
        <label style="display:block;margin-bottom:6px">Owner</label>
        <input id="ownerInput" placeholder="e.g. SG-1">
      </div>
      <div>
        <label style="display:block;margin-bottom:6px">Access</label>
        <select id="accessInput"><option value="true">true</option><option value="false">false</option></select>
      </div>
      <button id="btnAddCode">Add / Update</button>
      <button id="btnRefreshCodes">Refresh</button>
    </div>

    <div class="log" style="margin-top:14px">
      <div class="row" style="background:#0e1a20;font-weight:700">
        <div>Code</div><div>Owner</div><div>Access</div><div>Actions</div>
      </div>
      <div id="codesTable"></div>
    </div>
  </div>

  <!-- Log -->
  <div class="section">
    <h2>Frequency Log</h2>
    <div class="log" id="log">
      <div class="row" style="background:#0e1a20;font-weight:700">
        <div>Owner</div><div>Code</div><div>Status</div><div>Time</div>
      </div>
    </div>
  </div>
</div>

<!-- Overlay + audio -->
<div id="baseAlertOverlay" aria-hidden="true">
  <div class="baseAlert">BASE ALERT</div>
  <div class="codeBox">CODE 9</div>
</div>
<div class="soundBanner" id="soundBanner">Click anywhere to enable sounds</div>
<audio id="sndIncoming" preload="auto" src="incoming-traveler.mp3"></audio>
<audio id="sndBase" preload="auto" loop src="basealert.mp3"></audio>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
  import { getDatabase, ref, onChildAdded, onValue, get, child, remove, set, update } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";

  // === TVŮJ KONFIG ===
  const firebaseConfig = {
    apiKey: "AIzaSyAn5rsOUfkKBYhpQb3qwdUTElJP8Kg0dW0",
    authDomain: "project-gdo.firebaseapp.com",
    databaseURL: "https://project-gdo-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "project-gdo",
    storageBucket: "project-gdo.appspot.com",
    messagingSenderId: "758705115255",
    appId: "1:758705115255:web:878f5e64c164b75c507672"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  // UI refs
  const btnLogin=document.getElementById('btnLogin'), btnLogout=document.getElementById('btnLogout');
  const selFreq=document.getElementById('selFreq'), btnMonitor=document.getElementById('btnMonitor'), stateEl=document.getElementById('state');
  const logEl=document.getElementById('log'), overlay=document.getElementById('baseAlertOverlay');
  const sndIncoming=document.getElementById('sndIncoming'), sndBase=document.getElementById('sndBase'), soundBanner=document.getElementById('soundBanner');

  const alertSection=document.getElementById('alertSection'), codesPanel=document.getElementById('codesPanel');
  const btnCode9On=document.getElementById('btnCode9On'), btnCode9Off=document.getElementById('btnCode9Off'), btnAllClear=document.getElementById('btnAllClear'), code9State=document.getElementById('code9State');

  const codeInput=document.getElementById('codeInput'), ownerInput=document.getElementById('ownerInput'), accessInput=document.getElementById('accessInput');
  const btnAddCode=document.getElementById('btnAddCode'), btnRefresh=document.getElementById('btnRefreshCodes'), codesTable=document.getElementById('codesTable');

  let unsubFreq=null, unsubAlert=null, soundsEnabled=false;

  window.addEventListener('pointerdown', ()=>{ soundsEnabled=true; soundBanner.classList.remove('show'); }, { once:true });

  // Auth
  btnLogin.onclick = async ()=>{ await signInWithPopup(auth, new GoogleAuthProvider()); };
  btnLogout.onclick = ()=> signOut(auth);

  onAuthStateChanged(auth, async (user)=>{
    stopFreq(); toggleBaseAlert(false);
    if (user){
      btnLogin.style.display='none'; btnLogout.style.display='inline-block';
      selFreq.disabled=false; btnMonitor.disabled=false;
      stateEl.textContent='Awaiting Signal…'; stateEl.classList.add('blink');

      // Show operator sections
      alertSection.style.display='block';
      codesPanel.style.display='block';

      // Live alert status
      if (!unsubAlert){
        unsubAlert = onValue(ref(db,'alerts/CODE 9'), (snap)=>{
          const active = snap.val() === true;
          code9State.textContent = active ? 'CODE 9 ACTIVE' : 'CODE 9 OFF';
          code9State.style.borderColor = active ? 'var(--bad)' : '#12313a';
          toggleBaseAlert(active);
        });
      }
    } else {
      btnLogin.style.display='inline-block'; btnLogout.style.display='none';
      selFreq.disabled=true; btnMonitor.disabled=true;
      stateEl.textContent='Sign in required'; stateEl.classList.remove('blink');
      alertSection.style.display='none'; codesPanel.style.display='none';
    }
  });

  // Monitor
  btnMonitor.onclick = ()=>{
    stopFreq();
    const ch = selFreq.value, path=`frequencies/${ch}/signals`;
    stateEl.textContent = `Monitoring: ${ch}`; stateEl.classList.add('blink');
    unsubFreq = onChildAdded(ref(db, path), async (snap)=>{
      const data = snap.val(); await handleIncomingSignal(ch, data);
      setTimeout(()=>remove(ref(db, `${path}/${snap.key}`)).catch(()=>{}), 15000);
    });
  };
  function stopFreq(){ if (unsubFreq){ unsubFreq(); unsubFreq=null; } }

  async function handleIncomingSignal(ch, sig){
    if (soundsEnabled) try{ sndIncoming.currentTime=0; sndIncoming.play(); }catch{}
    const code = (sig?.code||'').toString().trim();
    const sc = await get(child(ref(db),'codes/'+code));
    let status='UNKNOWN', cls='warn', owner='—';
    if (sc.exists()){
      const c=sc.val(); owner = c.owner || '—';
      if (c.access===true){ status='VERIFIED'; cls='ok'; } else { status='INVALID'; cls='bad'; }
    }
    appendRow(owner, code, status, cls); flashStatus(status);
  }
  function appendRow(owner, code, status, cls){
    const row=document.createElement('div'); row.className='row';
    row.innerHTML=`<div>${esc(owner)}</div><div>${esc(code)}</div><div><span class="tag ${cls}">${status}</span></div><div>${new Date().toLocaleTimeString()}</div>`;
    logEl.appendChild(row); logEl.scrollTop=logEl.scrollHeight;
  }
  function flashStatus(status){
    let color='var(--warn)'; if(status==='VERIFIED')color='var(--ok)'; if(status==='INVALID')color='var(--bad)';
    stateEl.style.borderColor=color; stateEl.style.boxShadow=`0 0 16px ${color}55`; setTimeout(()=>{stateEl.style.boxShadow='none';},1200);
  }

  // Alerts write (každý přihlášený)
  btnCode9On.onclick  = async ()=>{ await set(ref(db,'alerts/CODE 9'), true); };
  btnCode9Off.onclick = async ()=>{ await set(ref(db,'alerts/CODE 9'), false); };
  btnAllClear.onclick = async ()=>{ await set(ref(db,'alerts/CODE 9'), false); };

  // Codes CRUD (každý přihlášený)
  btnAddCode.onclick = async ()=>{
    const code=(codeInput.value||'').trim(); if(!code) return alert('Code required');
    const owner=(ownerInput.value||'').trim()||'—'; const access=accessInput.value==='true';
    await set(ref(db,'codes/'+code), { owner, access });
    codeInput.value=''; ownerInput.value=''; accessInput.value='true';
    await loadCodesOnce();
  };
  btnRefresh.onclick = loadCodesOnce;

  async function loadCodesOnce(){
    const snap=await get(ref(db,'codes')); renderCodes(snap.exists()?snap.val():{});
  }
  function renderCodes(obj){
    codesTable.innerHTML=''; const entries=Object.entries(obj||{});
    if(entries.length===0){
      const empty=document.createElement('div'); empty.className='row';
      empty.innerHTML=`<div style="grid-column:1/5;opacity:.7">No codes</div>`;
      codesTable.appendChild(empty); return;
    }
    for (const [code,rec] of entries){
      const access=rec && rec.access===true ? 'true':'false'; const owner=(rec && rec.owner)||'—';
      const row=document.createElement('div'); row.className='row';
      row.innerHTML=`
        <div>${esc(code)}</div>
        <div>${esc(owner)}</div>
        <div><span class="tag ${access==='true'?'ok':'bad'}">${access}</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button data-act="toggle" data-code="${att(code)}">${access==='true'?'Disable':'Enable'}</button>
          <button data-act="edit" data-code="${att(code)}">Edit</button>
          <button data-act="del" data-code="${att(code)}" style="border-color:#ff3b3b;color:#ff3b3b">Delete</button>
        </div>`;
      codesTable.appendChild(row);
    }
  }
  codesTable.addEventListener('click', async e=>{
    const btn=e.target.closest('button'); if(!btn) return;
    const code=btn.getAttribute('data-code'); const act=btn.getAttribute('data-act');
    if (act==='toggle'){
      const sc=await get(ref(db,'codes/'+code));
      if (sc.exists()){ const current=!!sc.val().access; await update(ref(db,'codes/'+code), { access:!current }); await loadCodesOnce(); }
    } else if (act==='edit'){
      const sc=await get(ref(db,'codes/'+code));
      if (sc.exists()){ const rec=sc.val(); codeInput.value=code; ownerInput.value=rec.owner||''; accessInput.value=rec.access===true?'true':'false'; window.scrollTo({top: codesPanel.offsetTop-10, behavior:'smooth'}); }
    } else if (act==='del'){
      if (confirm(`Delete code ${code}?`)){ await set(ref(db,'codes/'+code), null); await loadCodesOnce(); }
    }
  });

  function toggleBaseAlert(active){
    overlay.classList.toggle('show', !!active);
    if (active && soundsEnabled) try{ sndBase.play(); }catch{} else { try{ sndBase.pause(); sndBase.currentTime=0; }catch{} }
    if (active && !soundsEnabled) soundBanner.classList.add('show'); else soundBanner.classList.remove('show');
  }
  function esc(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  function att(s){return String(s).replace(/"/g,'&quot;')}
</script>
</body>
</html>
