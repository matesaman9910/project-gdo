<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SGC Listener</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#000;--panel:#0c1620;--panel2:#091217;--line:#133645;--fg:#d9faff;--ok:#2ee66b;--warn:#ffb02e;--bad:#ff3b3b;--accent:#00e6e6}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#000;color:var(--fg);font-family:Orbitron,system-ui,Segoe UI,Roboto,Arial,sans-serif}
  .page{min-height:100dvh;display:grid;place-items:center;overflow:hidden}
  .shell{z-index:1;width:min(1200px,96vw);border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,var(--panel),var(--panel2));box-shadow:0 0 60px #00e6e633;padding:18px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  h1{margin:0;color:var(--accent);letter-spacing:2px;text-shadow:0 0 14px #00e6e63d}
  .tabs{display:flex;gap:10px;justify-content:center;margin-bottom:12px}
  .tab{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#0b141c;cursor:pointer}
  .tab.active{outline:2px solid #1e94aa}
  .panel{border:1px solid var(--line);border-radius:16px;background:#0b141c;padding:14px;margin-top:10px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button,select,input,textarea{background:#0d1a23;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-family:inherit;letter-spacing:1px}
  .status{padding:10px 14px;border-radius:10px;background:#0f1b23;border:1px solid var(--line)}
  .blink{animation:blink 1s infinite}@keyframes blink{50%{opacity:.35}}
  .view{display:none}.view.active{display:block}
  .pipe{display:grid;gap:10px;margin-top:10px}
  .step{border:1px dashed #27596a;border-radius:12px;padding:10px;background:#0a1219}
  .emph{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px}
  .ownerBig{font-size:32px;font-weight:800;color:#00e6e6;text-shadow:0 0 10px #00e6e650}
  .resultBig{font-size:42px;font-weight:900;letter-spacing:2px;padding:10px 20px;border-radius:14px;border:3px solid transparent;text-transform:uppercase}
  .ok{border-color:var(--ok);color:#0f0}.bad{border-color:var(--bad);color:#ff3b3b}.warn{border-color:var(--warn);color:#ffb02e}
  .codeRow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #123}
  .codeRow b{min-width:140px}
  .descRow{display:grid;grid-template-columns:180px 1fr auto;gap:10px;align-items:center;padding:6px 0}
  .descRow label{opacity:.9}
</style>
</head>
<body>
<main class="page">
  <div class="shell">
    <div class="topbar">
      <h1>SGC Listener</h1>
      <div>
        <button id="btnLogin">Sign in with Google</button>
        <button id="btnLogout" style="display:none">Sign out</button>
      </div>
    </div>

    <div class="tabs">
      <button id="tabListener" class="tab active">Listener</button>
      <button id="tabMgmt" class="tab">Management</button>
    </div>

    <!-- LISTENER -->
    <section id="viewListener" class="view active">
      <div class="panel">
        <div class="row">
          <label for="selFreq" style="opacity:.85">Frequency</label>
          <select id="selFreq" disabled>
            <option value="alpha-1">alpha-1</option>
            <option value="bravo-2">bravo-2</option>
            <option value="charlie-3">charlie-3</option>
          </select>
          <div id="state" class="status">Sign in required</div>
        </div>

        <div class="pipe">
          <div class="step"><b>Status:</b> <span id="sigStatus">Idle</span></div>
          <div class="step"><b>Encrypted:</b> <span id="encView">—</span></div>
          <div class="step"><b>Decrypted:</b> <span id="decView">—</span></div>
          <div class="step emph">
            <div><b>Owner:</b> <span id="ownerView" class="ownerBig">—</span></div>
            <div><b>Result:</b> <span id="resView" class="resultBig warn">—</span></div>
          </div>
        </div>
      </div>
    </section>

    <!-- MANAGEMENT -->
    <section id="viewMgmt" class="view">
      <div class="panel" id="alertsPanel"><h3 style="margin:0 0 10px">Alarms — Codes 1–9 + Specials</h3></div>

      <div class="panel" style="margin-top:12px">
        <h3 style="margin:0 0 10px">Access Codes</h3>
        <div class="row">
          <input id="codeInput" placeholder="Code">
          <input id="ownerInput" placeholder="Owner">
          <select id="accessInput"><option value="true">true</option><option value="false">false</option></select>
          <button id="btnAddCode">Add / Update</button>
          <button id="btnRefreshCodes">Refresh</button>
        </div>
        <div id="codesTable" style="margin-top:10px"></div>
      </div>
    </section>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
  import { getDatabase, ref, onChildAdded, get, remove, set, update } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";

  // Alarms order (priority)
  const ALARM_KEYS = [
    "CODE 1","CODE 2","CODE 3","CODE 4","CODE 5","CODE 6","CODE 7","CODE 8","CODE 9",
    "BIOHAZARD","POWER FAILURE","COMMUNICATIONS FAILURE","EVAC","SELF-DESTRUCT"
  ];

  const firebaseConfig = {
    apiKey: "AIzaSyAn5rsOUfkKBYhpQb3qwdUTElJP8Kg0dW0",
    authDomain: "project-gdo.firebaseapp.com",
    databaseURL: "https://project-gdo-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "project-gdo",
    storageBucket: "project-gdo.appspot.com",
    messagingSenderId: "758705115255",
    appId: "1:758705115255:web:878f5e64c164b75c507672"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getDatabase(app);

  // Tabs
  const tabListener = document.getElementById('tabListener');
  const tabMgmt     = document.getElementById('tabMgmt');
  const viewListener= document.getElementById('viewListener');
  const viewMgmt    = document.getElementById('viewMgmt');
  function activateTab(which){
    tabListener.classList.toggle('active', which==='listener');
    tabMgmt.classList.toggle('active', which==='mgmt');
    viewListener.classList.toggle('active', which==='listener');
    viewMgmt.classList.toggle('active', which==='mgmt');
  }
  tabListener.onclick = () => activateTab('listener');
  tabMgmt.onclick     = () => activateTab('mgmt');

  // Listener refs
  const selFreq   = document.getElementById('selFreq');
  const stateEl   = document.getElementById('state');
  const sigStatus = document.getElementById('sigStatus');
  const encView   = document.getElementById('encView');
  const decView   = document.getElementById('decView');
  const ownerView = document.getElementById('ownerView');
  const resView   = document.getElementById('resView');

  // Auth buttons
  const btnLogin  = document.getElementById('btnLogin');
  const btnLogout = document.getElementById('btnLogout');
  btnLogin.onclick  = () => signInWithPopup(auth, new GoogleAuthProvider());
  btnLogout.onclick = () => signOut(auth);

  let unsubFreq = null;

  onAuthStateChanged(auth, async user=>{
    stopMonitor();
    if (user){
      btnLogin.style.display='none';
      btnLogout.style.display='inline-block';
      selFreq.disabled=false;
      selFreq.value='alpha-1';
      startMonitor();
      stateEl.textContent='Monitoring alpha-1'; stateEl.classList.add('blink');
      await buildAlarms();
      await buildCodes();
    } else {
      btnLogin.style.display='inline-block';
      btnLogout.style.display='none';
      selFreq.disabled=true;
      stateEl.textContent='Sign in required'; stateEl.classList.remove('blink');
      activateTab('listener');
    }
  });

  selFreq.addEventListener('change', ()=> startMonitor());

  function startMonitor(){
    stopMonitor();
    const ch = selFreq.value;
    const path = `frequencies/${ch}/signals`;
    stateEl.textContent = `Monitoring: ${ch}`; stateEl.classList.add('blink');
    unsubFreq = onChildAdded(ref(db, path), async (snap)=>{
      const data = snap.val();
      await handleSignal(ch, data);
      setTimeout(()=> remove(ref(db, `${path}/${snap.key}`)).catch(()=>{}), 10000);
    });
  }
  function stopMonitor(){ if (unsubFreq){ unsubFreq(); unsubFreq = null; } }

  async function handleSignal(ch, sig){
    const code = (sig?.code || '').trim();
    const encrypted = sig?.encrypted || btoa(unescape(encodeURIComponent(code)));

    sigStatus.textContent = `INCOMING on ${ch}`;
    encView.textContent='…'; decView.textContent='…'; ownerView.textContent='—'; resView.textContent='—'; resView.className='resultBig warn';
    await new Promise(r=>setTimeout(r,200));
    encView.textContent = encrypted;
    sigStatus.textContent = 'DECRYPTING…';
    await new Promise(r=>setTimeout(r,520));
    decView.textContent = code;

    const sc = await get(ref(db, 'codes/'+code));
    let label='UNKNOWN', cls='warn', owner='—';
    if (sc.exists()){
      const c = sc.val();
      owner = c.owner || '—';
      label = (c.access===true) ? 'ALLOWED' : 'DENIED';
      cls   = (c.access===true) ? 'ok'      : 'bad';
    }
    ownerView.textContent = owner;
    resView.textContent   = label;
    resView.className     = `resultBig ${cls}`;
  }

  // --------- Management ----------
  const codeInput   = document.getElementById('codeInput');
  const ownerInput  = document.getElementById('ownerInput');
  const accessInput = document.getElementById('accessInput');
  const btnAddCode  = document.getElementById('btnAddCode');
  const btnRefresh  = document.getElementById('btnRefreshCodes');
  const codesTable  = document.getElementById('codesTable');
  const alertsPanel = document.getElementById('alertsPanel');

  btnAddCode.onclick = async ()=>{
    const code=(codeInput.value||'').trim();
    if(!code) return alert('Code required');
    const owner=(ownerInput.value||'').trim()||'—';
    const access=(accessInput.value==='true');
    await set(ref(db, 'codes/'+code), { owner, access });
    codeInput.value=''; ownerInput.value=''; accessInput.value='true';
    await buildCodes();
  };
  btnRefresh.onclick = buildCodes;

  async function buildAlarms(){
    alertsPanel.innerHTML = '<h3 style="margin:0 0 10px">Alarms — Codes 1–9 + Specials</h3>';

    // descriptions current state
    const descSnap = await get(ref(db, 'alerts'));
    const a = descSnap.exists()? descSnap.val() : {};

    for (const key of ALARM_KEYS){
      const act = !!(a[key]?.active);
      const desc = (a[key]?.desc) || '';
      const row = document.createElement('div');
      row.className='descRow';
      row.innerHTML = `
        <label><b>${key}</b></label>
        <input data-k="desc" data-code="${key}" placeholder="Description…" value="${(desc+'').replace(/"/g,'&quot;')}"/>
        <div style="display:flex;gap:6px">
          <button data-k="save" data-code="${key}">Save</button>
          <button data-k="toggle" data-code="${key}">${act?'Turn OFF':'Turn ON'}</button>
          <span id="badge-${key}" style="align-self:center">${act?key+' ACTIVE':key+' OFF'}</span>
        </div>`;
      alertsPanel.appendChild(row);
    }

    alertsPanel.onclick = async e=>{
      const save = e.target.closest('button[data-k="save"]');
      if (save){
        const code = save.getAttribute('data-code');
        const input = alertsPanel.querySelector(`input[data-code="${CSS.escape(code)}"]`);
        await update(ref(db, `alerts/${code}`), { desc: input.value || '' });
        return;
      }
      const toggle = e.target.closest('button[data-k="toggle"]');
      if (toggle){
        const code = toggle.getAttribute('data-code');
        const actSnap = await get(ref(db, `alerts/${code}/active`));
        const isActive = actSnap.exists()? !!actSnap.val() : false;

        // one active at a time
        const updates = {};
        for (const k of ALARM_KEYS){ updates[`alerts/${k}/active`] = false; }
        if (!isActive) updates[`alerts/${code}/active`] = true;

        await update(ref(db), updates);
        await buildAlarms();
      }
    };
  }

  async function buildCodes(){
    codesTable.innerHTML='';
    const snap = await get(ref(db, 'codes'));
    if(!snap.exists()){ codesTable.innerHTML='<i>No codes.</i>'; return; }
    const data = snap.val();
    for (const [code, v] of Object.entries(data)){
      const row = document.createElement('div');
      row.className='codeRow';
      row.innerHTML = `
        <b>${code}</b>
        <span>${v.owner||'—'}</span>
        <span>Access: ${v.access}</span>
        <button data-toggle="${code}">Toggle Access</button>
        <button data-del="${code}">Delete</button>`;
      codesTable.appendChild(row);
    }
    codesTable.querySelectorAll('button[data-del]').forEach(b=>{
      b.onclick = async ()=>{
        const id = b.dataset.del;
        await remove(ref(db, 'codes/'+id));
        await buildCodes();
      };
    });
    codesTable.querySelectorAll('button[data-toggle]').forEach(b=>{
      b.onclick = async ()=>{
        const id = b.dataset.toggle;
        const s = await get(ref(db, 'codes/'+id));
        if(!s.exists()) return;
        const val = s.val();
        await update(ref(db, 'codes/'+id), { owner: val.owner||'—', access: !val.access });
        await buildCodes();
      };
    });
  }
</script>
</body>
</html>
